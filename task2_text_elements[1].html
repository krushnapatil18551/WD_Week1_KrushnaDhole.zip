<body>
    <!-- This page demonstrates HTML text formatting elements. -->

    <h1>Heading H1</h1>
    <h2>Heading H2</h2>
    <h3>Heading H3</h3>
    <h4>Heading H4</h4>
    <h5>Heading H5</h5>
    <h6>Heading H6</h6>

    <p>HTML is the standard markup language used to structure content on the web.</p>
    <p><strong>Bold text</strong>, <em>italic text</em>, and <u>underlined text</u>.</p>

    <p>Line one.<br>Line two after a line break.</p>
    <hr>

    <p>Water formula: H<sub>2</sub>O</p>
    <p>Mathematical expression: x<sup>2</sup> + y<sup>2</sup></p>
