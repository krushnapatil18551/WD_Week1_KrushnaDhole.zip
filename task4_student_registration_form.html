<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form - Krushna Dhole</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <p>Please fill in the details below.</p>

    <form action="#" method="post">
        <fieldset>
            <legend>Personal Information</legend>

            <p>
                <label for="name">Full Name:</label><br>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </p>

            <p>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </p>

            <p>
                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required>
            </p>

            <p>
                Gender:<br>
                <input type="radio" id="male" name="gender" value="Male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="Female">
                <label for="female">Female</label>
                <input type="radio" id="other" name="gender" value="Other">
                <label for="other">Other</label>
            </p>

            <p>
                <label for="dob">Date of Birth:</label><br>
                <input type="date" id="dob" name="dob" required>
            </p>
        </fieldset>

        <fieldset>
            <legend>Course Information</legend>

            <p>
                <label for="course">Select Course:</label><br>
                <select id="course" name="course" required>
                    <option value="">-- Select Course --</option>
                    <option value="web-development">Web Development</option>
                    <option value="data-science">Data Science</option>
                    <option value="computer-science">Computer Science</option>
                    <option value="artificial-intelligence">Artificial Intelligence</option>
                </select>
            </p>

            <p>
                Preferred Learning Mode:<br>
                <input type="radio" id="online" name="mode" value="Online" required>
                <label for="online">Online</label>
                <input type="radio" id="offline" name="mode" value="Offline">
                <label for="offline">Offline</label>
            </p>

            <p>
                Skills / Interests:<br>
                <input type="checkbox" id="html" name="skills" value="HTML">
                <label for="html">HTML</label>
                <input type="checkbox" id="css" name="skills" value="CSS">
                <label for="css">CSS</label>
                <input type="checkbox" id="js" name="skills" value="JavaScript">
                <label for="js">JavaScript</label>
                <input type="checkbox" id="python" name="skills" value="Python">
                <label for="python">Python</label>
            </p>

            <p>
                <label for="address">Address:</label><br>
                <textarea id="address" name="address" rows="5" cols="40" placeholder="Enter your complete address" required></textarea>
            </p>
        </fieldset>

        <p>
            <button type="submit">Submit Registration</button>
            <button type="reset">Reset Form</button>
        </p>
    </form>
</body>
</html>
